<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bika AI — Event Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  header {
    background: #1a1d27; border-bottom: 1px solid #2d3148;
    padding: 14px 28px; display: flex; align-items: center; gap: 16px;
  }
  header .logo { font-size: 1.3rem; font-weight: 700; color: #fff; }
  header .logo span { color: #6366f1; }
  .badge { background: #6366f1; color: #fff; font-size: 0.72rem;
           padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .header-right { margin-left: auto; display: flex; gap: 12px; align-items: center; }

  /* Stats bar */
  .stats-bar {
    background: #1a1d27; border-bottom: 1px solid #2d3148;
    padding: 10px 28px; display: flex; gap: 32px; font-size: 0.85rem;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .val { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .stat .lbl { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.green .val { color: #4ade80; }
  .stat.red .val { color: #f87171; }
  .stat.yellow .val { color: #facc15; }

  /* Filters */
  .toolbar {
    padding: 14px 28px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid #1e2030;
  }
  .filter-btn {
    background: #1e2235; border: 1px solid #2d3148; color: #94a3b8;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .filter-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  .filter-btn:hover:not(.active) { border-color: #6366f1; color: #e2e8f0; }
  .refresh-btn {
    margin-left: auto; background: transparent; border: 1px solid #2d3148;
    color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: #6366f1; color: #e2e8f0; }

  /* Event grid */
  .grid { padding: 24px 28px; display: grid; gap: 20px;
          grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }

  .card {
    background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px;
    overflow: hidden; transition: border-color 0.15s;
  }
  .card:hover { border-color: #6366f1; }
  .card.status-reviewed { border-left: 3px solid #4ade80; }
  .card.status-pending  { border-left: 3px solid #facc15; }

  .card-media { position: relative; background: #0a0b0f; height: 200px;
                display: flex; align-items: center; justify-content: center; }
  .card-media video, .card-media img { max-height: 200px; width: 100%; object-fit: contain; }
  .media-badge {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem;
    padding: 2px 8px; border-radius: 4px;
  }

  .card-body { padding: 14px; }
  .event-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .event-type { font-size: 1rem; font-weight: 600; color: #fff; }
  .event-id { color: #475569; font-size: 0.75rem; }
  .meta-row { font-size: 0.8rem; color: #64748b; display: flex; gap: 16px; margin-bottom: 12px; }
  .meta-row span { display: flex; align-items: center; gap: 4px; }

  /* Confidence bar */
  .conf-bar { height: 4px; background: #1e2235; border-radius: 2px; margin-bottom: 14px; }
  .conf-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #6366f1, #a855f7); }

  /* Review section */
  .verdict-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
                   color: #64748b; margin-bottom: 6px; }
  .verdict-btns { display: flex; gap: 6px; margin-bottom: 10px; }
  .v-btn {
    flex: 1; padding: 7px; border: 1px solid #2d3148; border-radius: 7px;
    background: #0f1117; color: #94a3b8; cursor: pointer; font-size: 0.82rem;
    font-weight: 500; transition: all 0.15s; text-align: center;
  }
  .v-btn:hover { border-color: #6366f1; }
  .v-btn.selected-correct   { background: #14532d; border-color: #4ade80; color: #4ade80; }
  .v-btn.selected-false_alarm { background: #450a0a; border-color: #f87171; color: #f87171; }
  .v-btn.selected-unsure    { background: #1c1917; border-color: #facc15; color: #facc15; }

  select, input, textarea {
    width: 100%; background: #0f1117; border: 1px solid #2d3148; color: #e2e8f0;
    border-radius: 6px; padding: 7px 10px; font-size: 0.82rem; margin-bottom: 8px;
    font-family: inherit;
  }
  select:focus, input:focus, textarea:focus {
    outline: none; border-color: #6366f1;
  }
  textarea { resize: vertical; min-height: 56px; }

  .submit-btn {
    width: 100%; padding: 9px; background: #6366f1; border: none; border-radius: 7px;
    color: #fff; font-weight: 600; cursor: pointer; font-size: 0.88rem; transition: background 0.15s;
  }
  .submit-btn:hover { background: #4f46e5; }
  .submit-btn:disabled { background: #2d3148; color: #475569; cursor: not-allowed; }

  /* Reviewed badge */
  .reviewed-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; margin-bottom: 8px;
  }
  .reviewed-badge.correct     { background: #14532d; color: #4ade80; }
  .reviewed-badge.false_alarm { background: #450a0a; color: #f87171; }
  .reviewed-badge.unsure      { background: #1c1917; color: #facc15; }
  .reviewed-meta { font-size: 0.78rem; color: #64748b; }

  .empty { text-align: center; padding: 64px; color: #475569; font-size: 1rem; }
  .empty .icon { font-size: 3rem; margin-bottom: 12px; }

  .severity-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .sev-btn {
    flex: 1; padding: 5px; border: 1px solid #2d3148; border-radius: 5px;
    background: #0f1117; color: #64748b; cursor: pointer; font-size: 0.75rem; text-align: center;
    transition: all 0.15s;
  }
  .sev-btn.sel { border-color: #6366f1; color: #a5b4fc; background: #1e1b4b; }
</style>
</head>
<body>

<header>
  <div class="logo">Bika<span>AI</span></div>
  <span class="badge">MVP · Testing</span>
  <div class="header-right">
    <span id="live-dot" style="width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
    <span id="live-label" style="font-size:0.8rem;color:#4ade80;">Live</span>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><div class="val" id="s-total">—</div><div class="lbl">Total Events</div></div>
  <div class="stat yellow"><div class="val" id="s-pending">—</div><div class="lbl">Pending Review</div></div>
  <div class="stat green"><div class="val" id="s-correct">—</div><div class="lbl">Correct</div></div>
  <div class="stat red"><div class="val" id="s-false">—</div><div class="lbl">False Alarms</div></div>
  <div class="stat"><div class="val" id="s-precision">—</div><div class="lbl">Precision</div></div>
</div>

<div class="toolbar">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">Pending</button>
  <button class="filter-btn" data-filter="reviewed" onclick="setFilter('reviewed', this)">Reviewed</button>
  <button class="refresh-btn" onclick="loadAll()">↺ Refresh</button>
</div>

<div class="grid" id="event-grid">
  <div class="empty"><div class="icon">📡</div>Waiting for events from the detector…</div>
</div>

<script>
const API = '';  // same origin
let currentFilter = 'all';
let events = [];

// ── State tracking for cards ──────────────────────────────────────────────
const cardState = {};  // event_id → { verdict, actual_label, severity, notes }

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

async function loadStats() {
  try {
    const r = await fetch(`${API}/stats`);
    const d = await r.json();
    document.getElementById('s-total').textContent = d.total_events;
    document.getElementById('s-pending').textContent = d.pending;
    document.getElementById('s-correct').textContent = d.verdicts.correct ?? 0;
    document.getElementById('s-false').textContent = d.verdicts.false_alarm ?? 0;
    document.getElementById('s-precision').textContent =
      d.precision_pct !== null ? d.precision_pct + '%' : '—';
  } catch (_) {}
}

async function loadEvents() {
  try {
    const r = await fetch(`${API}/events?limit=100`);
    const d = await r.json();
    events = d.events || [];
  } catch (_) {
    events = [];
  }
}

async function loadAll() {
  await Promise.all([loadStats(), loadEvents()]);
  renderGrid();
}

function getState(id) {
  if (!cardState[id]) cardState[id] = { verdict: null, actual_label: '', severity: null, notes: '' };
  return cardState[id];
}

function renderGrid() {
  const grid = document.getElementById('event-grid');
  let filtered = events;
  if (currentFilter !== 'all') filtered = events.filter(e => e.status === currentFilter);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><div class="icon">${currentFilter === 'pending' ? '✅' : '📡'}</div>
      ${currentFilter === 'pending' ? 'No pending events — great job!' : 'No events yet.'}</div>`;
    return;
  }

  grid.innerHTML = filtered.map(ev => cardHTML(ev)).join('');
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function cardHTML(ev) {
  const s = getState(ev.id);
  const isReviewed = ev.status === 'reviewed' && ev.review;
  const mediaHTML = ev.clip_url
    ? `<video controls preload="metadata" src="${ev.clip_url}" style="max-height:200px;width:100%;object-fit:contain;"></video>
       <span class="media-badge">clip</span>`
    : ev.snapshot_url
    ? `<img src="${ev.snapshot_url}" alt="snapshot"><span class="media-badge">snapshot</span>`
    : `<div style="color:#475569;font-size:0.8rem;">No media yet</div>`;

  const confPct = Math.round((ev.confidence || 0) * 100);

  const reviewSection = isReviewed ? `
    <div class="reviewed-badge ${ev.review.verdict}">${
      ev.review.verdict === 'correct' ? '✓ Correct' :
      ev.review.verdict === 'false_alarm' ? '✗ False Alarm' : '? Unsure'
    }</div>
    <div class="reviewed-meta">
      ${ev.review.actual_label ? `<div>Label: <b>${ev.review.actual_label}</b></div>` : ''}
      ${ev.review.severity ? `<div>Severity: ${ev.review.severity}</div>` : ''}
      ${ev.review.notes ? `<div>Notes: ${ev.review.notes}</div>` : ''}
      <div>${formatDate(ev.review.reviewed_at)}</div>
    </div>
    <div style="margin-top:8px">
      <button class="submit-btn" style="background:#1e2235;color:#94a3b8"
        onclick="openReEdit(${ev.id})">Edit review</button>
    </div>
  ` : buildReviewForm(ev.id, s);

  return `
  <div class="card status-${ev.status}" id="card-${ev.id}">
    <div class="card-media">${mediaHTML}</div>
    <div class="card-body">
      <div class="event-meta">
        <div>
          <div class="event-type">${capitalize(ev.event_type)}</div>
          <div class="event-id">#${ev.id} · ${ev.camera_id}</div>
        </div>
        <div style="text-align:right;font-size:0.78rem;color:#64748b">${formatDate(ev.created_at)}</div>
      </div>
      <div class="meta-row">
        <span>🎯 Confidence: ${confPct}%</span>
        ${ev.torso_angle != null ? `<span>📐 Angle: ${ev.torso_angle}°</span>` : ''}
      </div>
      <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%"></div></div>
      ${reviewSection}
    </div>
  </div>`;
}

function buildReviewForm(id, s) {
  const verdicts = ['correct', 'false_alarm', 'unsure'];
  const vLabels = { correct: '✓ Correct', false_alarm: '✗ False Alarm', unsure: '? Unsure' };
  const vBtns = verdicts.map(v =>
    `<button class="v-btn ${s.verdict === v ? 'selected-' + v : ''}"
      onclick="selectVerdict(${id}, '${v}')">${vLabels[v]}</button>`
  ).join('');

  const severities = ['Low', 'Medium', 'High', 'Emergency'];
  const sevBtns = severities.map(sv =>
    `<button class="sev-btn ${s.severity === sv ? 'sel' : ''}"
      onclick="selectSeverity(${id}, '${sv}')">${sv}</button>`
  ).join('');

  return `
    <div class="verdict-label">Was this alert correct?</div>
    <div class="verdict-btns">${vBtns}</div>
    <div class="verdict-label">What actually happened?</div>
    <select onchange="selectLabel(${id}, this.value)">
      <option value="">— select —</option>
      <optgroup label="Falls">
        <option value="real_fall">Real fall</option>
        <option value="sat_down">Person sat down</option>
        <option value="bent_over">Bent over / picking up</option>
        <option value="lying_on_purpose">Lying on purpose (resting)</option>
      </optgroup>
      <optgroup label="Other">
        <option value="no_person">No person visible</option>
        <option value="camera_issue">Camera issue / occlusion</option>
        <option value="other">Other</option>
      </optgroup>
    </select>
    <div class="verdict-label">Severity</div>
    <div class="severity-row">${sevBtns}</div>
    <textarea placeholder="Notes (optional)…" onchange="updateNotes(${id}, this.value)">${s.notes}</textarea>
    <button class="submit-btn" onclick="submitReview(${id})"
      ${s.verdict ? '' : 'disabled'}>Submit Review</button>
  `;
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1).replace('_', ' '); }

function selectVerdict(id, verdict) {
  const s = getState(id);
  s.verdict = verdict;
  refreshCard(id);
}

function selectSeverity(id, sev) {
  const s = getState(id);
  s.severity = sev;
  refreshCard(id);
}

function selectLabel(id, val) {
  getState(id).actual_label = val;
}

function updateNotes(id, val) {
  getState(id).notes = val;
}

function refreshCard(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  const card = document.getElementById(`card-${id}`);
  if (!card) return;
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = cardHTML(ev);
  const newCard = tempDiv.firstElementChild;
  card.replaceWith(newCard);
}

function openReEdit(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  // Pre-fill state from existing review
  if (ev.review) {
    cardState[id] = {
      verdict: ev.review.verdict,
      actual_label: ev.review.actual_label || '',
      severity: ev.review.severity || null,
      notes: ev.review.notes || '',
    };
    ev.status = 'pending';  // temporarily show form
    ev.review = null;
  }
  refreshCard(id);
}

async function submitReview(id) {
  const s = getState(id);
  if (!s.verdict) return;
  try {
    const r = await fetch(`${API}/events/${id}/review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        verdict: s.verdict,
        actual_label: s.actual_label || null,
        severity: s.severity || null,
        notes: s.notes || null,
      }),
    });
    if (r.ok) {
      await loadAll();
    }
  } catch (e) {
    alert('Failed to submit. Is the server running?');
  }
}

// ── Auto-refresh every 10 seconds ─────────────────────────────────────────
loadAll();
setInterval(loadAll, 10000);
</script>
</body>
</html>
